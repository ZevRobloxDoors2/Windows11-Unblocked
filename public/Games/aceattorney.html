<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ace Attorney</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #game { width: 100%; height: 100%; }
        .instructions { color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        window.EJS_player = "#game";
        window.EJS_core = "nds";
        window.EJS_gameUrl = "Phoenix_Wright.zip"; 
        window.EJS_pathtodata = "https://raw.githubusercontent.com/EmulatorJS/EmulatorJS/main/data/"; 
        window.EJS_startOnLoaded = true;
    </script>
    <script src="https://raw.githubusercontent.com/EmulatorJS/EmulatorJS/main/data/loader.js"></script>
    <!-- Fallback if rawgit or similar is needed, but we'll try a cdn -->
    <script>
        // Use a CDN for EmulatorJS to avoid needing local data folder
        window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/";
        let script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js";
        document.body.appendChild(script);
    </script>
</body>
</html>
